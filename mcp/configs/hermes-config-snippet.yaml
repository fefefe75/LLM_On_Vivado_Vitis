# Extrait a ajouter dans ~/.hermes/config.yaml (profil courant)
#
# Verifie sur la cle reelle utilisee par Hermes : `mcp_servers` (voir la config
# d'exemple du projet : ~/.hermes/config.yaml). Un serveur stdio se declare avec
# command/args/env ; `enabled: true` le charge au demarrage de la session.
mcp_servers:
  vivado-vitis:
    command: /chemin/vers/venv/bin/python
    args:
      - "-m"
      - "vivado_mcp"
      - "--workspace"
      - "/home/utilisateur/mon_projet_fpga"
    env:
      PYTHONPATH: /chemin/vers/LLM_On_Vivado_Vitis/mcp
      FPGA_MCP_TOOL_ROOT: /tools/Xilinx
      FPGA_MCP_TIMEOUT: "3600"
    enabled: true

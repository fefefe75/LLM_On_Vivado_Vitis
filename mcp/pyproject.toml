[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vivado-mcp"
version = "0.1.0"
description = "Serveur MCP pour piloter Vivado, Vitis et les simulateurs HDL depuis un agent LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fpga", "vivado", "vitis", "vhdl", "cocotb", "mcp", "llm", "agent"]
dependencies = [
    "fastmcp>=2.3,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vivado-mcp = "vivado_mcp.__main__:main"

[tool.setuptools]
packages = ["vivado_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
